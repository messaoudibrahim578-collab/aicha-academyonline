services:
  - type: web
    name: aicha-academy
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: academy-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
